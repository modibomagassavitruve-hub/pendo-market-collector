name: Collecte des indices africains

on:
  # Planification désactivée : depuis GitHub Actions, toutes les sources testées
  # bloquent (AFX : connexion refusée, Investing.com : 403, Yahoo : 429).
  # À réactiver si une source accepte les serveurs GitHub.
  # schedule:
  #   - cron: '*/15 7-17 * * 1-5'
  #   - cron: '0 20 * * 1-5'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collecter et envoyer au backend PENDO
        env:
          PENDO_CRON_SECRET: ${{ secrets.PENDO_CRON_SECRET }}
        run: node collect.mjs
