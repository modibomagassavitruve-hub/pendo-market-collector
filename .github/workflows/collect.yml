name: Collecte des indices africains

on:
  schedule:
    # Toutes les 15 min pendant les heures des bourses africaines (7h-17h UTC, lun-ven)
    - cron: '*/15 7-17 * * 1-5'
    # Clôture
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collecter et envoyer au backend PENDO
        env:
          PENDO_CRON_SECRET: ${{ secrets.PENDO_CRON_SECRET }}
          # Depuis GitHub, seuls les sites officiels BRVM et NGX répondent ; le reste vient du Mac
          PENDO_ONLY: brvm,nse_ng
        run: node collect.mjs
